<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlyArm Runs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #f3f6f7; --surface: #ffffff; --surface-2: #f8fbfc; --ink: #14232e; --muted: #5e7380;
    --rule: #d9e3e8; --soft: #e9f0f3; --accent: #0b7a86; --running: #b07a0c; --good: #1c8554;
    --bad: #b3432d; --stalled: #8a5a9e; --line-1: #0b7a86; --line-2: #c25b3a; --line-3: #6d5bc2;
    --line-4: #3d8c40; --line-5: #b07a0c;
    --sans: "IBM Plex Sans", -apple-system, "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1418; --surface: #151e24; --surface-2: #121a1f; --ink: #e2eaee; --muted: #8fa1ab;
      --rule: #25333c; --soft: #1b262d; --accent: #45c2cd; --running: #e0b04a; --good: #57c28f;
      --bad: #ee7b62; --stalled: #c39ad6; --line-1: #45c2cd; --line-2: #ee8f6a; --line-3: #a597f0;
      --line-4: #7fcf83; --line-5: #e0b04a;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); }
  header { display: flex; align-items: center; gap: 18px; padding: 12px 20px; border-bottom: 1px solid var(--rule); background: var(--surface); position: sticky; top: 0; z-index: 5; }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  header nav { display: flex; gap: 4px; }
  header nav button { border: 1px solid transparent; background: none; color: var(--muted); font: 500 13px var(--sans); padding: 5px 12px; border-radius: 6px; cursor: pointer; }
  header nav button[aria-pressed="true"] { color: var(--ink); background: var(--soft); border-color: var(--rule); }
  .refresh { margin-left: auto; color: var(--muted); font: 12px var(--mono); }
  main { display: grid; grid-template-columns: minmax(300px, 380px) 1fr; min-height: calc(100vh - 53px); }
  aside { border-right: 1px solid var(--rule); background: var(--surface-2); display: flex; flex-direction: column; max-height: calc(100vh - 53px); position: sticky; top: 53px; }
  .filters { padding: 12px 14px; display: grid; gap: 8px; border-bottom: 1px solid var(--rule); }
  .filters input { width: 100%; padding: 7px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); color: var(--ink); font: 13px var(--sans); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { border: 1px solid var(--rule); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 2px 9px; font: 500 11px var(--mono); cursor: pointer; }
  .chip[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
  .list { overflow-y: auto; padding: 6px; }
  .run { display: block; width: 100%; text-align: left; border: 1px solid transparent; background: none; color: inherit; border-radius: 8px; padding: 9px 10px; cursor: pointer; font: inherit; }
  .run:hover { background: var(--soft); }
  .run[aria-current="true"] { background: var(--surface); border-color: var(--rule); box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
  .run-top { display: flex; align-items: center; gap: 7px; }
  .run-name { font: 500 13px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .run-meta { color: var(--muted); font: 11px var(--mono); margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; }
  .run-head { margin-top: 4px; display: grid; gap: 1px; font: 11.5px var(--mono); color: var(--ink); }
  .run-head span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .run-head b { font-weight: 500; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--muted); }
  .dot.running { background: var(--running); box-shadow: 0 0 0 3px color-mix(in srgb, var(--running) 22%, transparent); }
  .dot.complete, .dot.results { background: var(--good); }
  .dot.failed { background: var(--bad); }
  .dot.stalled { background: var(--stalled); }
  .pill { display: inline-block; border: 1px solid currentColor; border-radius: 999px; padding: 0 8px; font: 500 11px/1.7 var(--mono); text-transform: uppercase; letter-spacing: 0.04em; }
  .pill.running { color: var(--running); } .pill.complete, .pill.results { color: var(--good); } .pill.failed { color: var(--bad); } .pill.stalled { color: var(--stalled); } .pill.unknown { color: var(--muted); }
  .content { padding: 22px 26px 60px; min-width: 0; }
  .empty { color: var(--muted); padding: 40px 0; }
  .detail-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .detail-head h2 { margin: 0; font: 600 20px var(--mono); letter-spacing: -0.01em; word-break: break-all; }
  .sub { color: var(--muted); font: 12px var(--mono); margin-top: 4px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-top: 16px; }
  .card { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; }
  .card .k { color: var(--muted); font: 11px var(--mono); text-transform: uppercase; letter-spacing: 0.04em; }
  .card .v { font: 500 14px var(--mono); margin-top: 3px; word-break: break-word; }
  section { margin-top: 26px; }
  section h3 { margin: 0 0 10px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .chart { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px 8px; }
  .chart-title { font: 500 12px var(--mono); margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart .axis { fill: var(--muted); font: 10px var(--mono); }
  .chart .grid { stroke: var(--rule); stroke-width: 1; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; font: 11px var(--mono); color: var(--muted); margin-top: 4px; }
  .legend i { display: inline-block; width: 10px; height: 2px; vertical-align: middle; margin-right: 4px; }
  .videos { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .videos figure { margin: 0; display: grid; gap: 5px; }
  .videos video, .videos img { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; border-radius: 6px; border: 1px solid var(--rule); background: #0b1013; display: block; }
  .videos figcaption { font: 11px var(--mono); color: var(--muted); word-break: break-all; }
  pre { margin: 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; overflow: auto; font: 12px/1.55 var(--mono); max-height: 420px; }
  details summary { cursor: pointer; color: var(--muted); font: 500 12px var(--mono); margin: 6px 0; }
  .tabs-empty { color: var(--muted); font: 12px var(--mono); }
  .featured { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 16px; align-items: start; }
  .feature { margin: 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; display: grid; align-content: start; }
  .feature video { width: 100%; height: 340px; object-fit: contain; display: block; background: #0b1013; border: 0; border-bottom: 1px solid var(--rule); }
  .feature figcaption { padding: 10px 12px 12px; display: grid; gap: 4px; font: 13px/1.45 var(--sans); color: var(--muted); word-break: normal; }
  .feature figcaption b { color: var(--ink); font-weight: 600; font-size: 14px; }
  .videos figcaption { display: grid; gap: 1px; word-break: normal; }
  .videos figcaption b { color: var(--ink); font: 500 12px var(--sans); }
  .videos figcaption span { font: 11px var(--mono); color: var(--muted); }
  .gallery-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 14px; }
  .gallery-tools input[type="search"] { flex: 1 1 260px; max-width: 420px; padding: 7px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); color: var(--ink); font: 13px var(--sans); }
  .toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font: 12px var(--mono); cursor: pointer; }
  details.area { margin-top: 14px; }
  details.area summary { cursor: pointer; font: 600 14px var(--sans); color: var(--ink); margin-bottom: 10px; list-style-position: outside; }
  details.area summary span { color: var(--muted); font: 500 12px var(--mono); margin-left: 6px; }
  .table { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font: 12.5px var(--mono); font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 12px; text-align: left; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; background: var(--soft); }
  tbody tr:last-child td { border-bottom: 0; }
  td.num { color: var(--accent); font-weight: 500; }
  td.seeds { color: var(--muted); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; }
    aside { position: static; max-height: 45vh; border-right: 0; border-bottom: 1px solid var(--rule); }
    .content { padding: 16px; }
    header { flex-wrap: wrap; padding: 10px 16px; }
  }
</style>
</head>
<body>
<header>
  <h1>FlyArm runs</h1>
  <nav>
    <button id="tab-runs" aria-pressed="true">Runs</button>
    <button id="tab-rollouts" aria-pressed="false">Rollouts</button>
    <button id="tab-live" aria-pressed="false">Live</button>
  </nav>
  <span class="refresh" id="refresh">loading</span>
</header>
<main id="runs-view">
  <aside>
    <div class="filters">
      <input id="search" type="search" placeholder="Filter runs by name">
      <div class="chips" id="family-chips"></div>
      <div class="chips" id="status-chips"></div>
      <label class="toggle"><input type="checkbox" id="show-prototypes"> 256-node prototypes</label>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <div class="content" id="detail"><p class="empty">Select a run.</p></div>
</main>
<main id="live-view" hidden style="grid-template-columns: 1fr;">
  <div class="content">
    <section style="margin-top: 0;">
      <h3>Live progress</h3>
      <p class="empty" id="live-empty" hidden>No run is being watched. Start one with <code>flyarm rl watch --run RUN</code>.</p>
      <div class="featured" id="live"></div>
    </section>
  </div>
</main>
<main id="rollouts-view" hidden style="grid-template-columns: 1fr;">
  <div class="content">
    <section style="margin-top: 0;"><h3>Featured</h3><div class="featured" id="featured"></div></section>
    <section>
      <h3>All rollouts</h3>
      <div class="gallery-tools">
        <input id="video-search" type="search" placeholder="Filter videos by title or experiment">
        <div class="chips" id="area-chips"></div>
        <label class="toggle"><input type="checkbox" id="show-hidden"> smoke tests and drafts</label>
      </div>
      <div id="gallery"></div>
    </section>
  </div>
</main>
<script>
const state = { live: [], runs: [], selected: null, family: new Set(), status: new Set(), query: "", videos: [], featured: [], videoQuery: "", areas: new Set(), showHidden: false, showPrototypes: false };
const AREA_ORDER = ["Reinforcement learning", "Pick and place", "Kitchen", "Multi-task", "Long horizon", "Dexterous hand", "Reach", "Other"];
const COLORS = ["--line-1", "--line-2", "--line-3", "--line-4", "--line-5"];
const escape = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

function ago(seconds) {
  const delta = Math.max(0, Date.now() / 1000 - seconds);
  if (delta < 60) return `${Math.round(delta)}s ago`;
  if (delta < 3600) return `${Math.round(delta / 60)} min ago`;
  if (delta < 86400) return `${(delta / 3600).toFixed(1)} h ago`;
  return `${Math.round(delta / 86400)} d ago`;
}
const stamp = (seconds) => new Date(seconds * 1000).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });

async function getJSON(url) {
  const response = await fetch(url, { cache: "no-store" });
  if (!response.ok) throw new Error(`${url}: ${response.status}`);
  return response.json();
}

function chips(container, values, active, onChange) {
  container.innerHTML = values.map((v) => `<button class="chip" aria-pressed="${active.has(v)}" data-v="${escape(v)}">${escape(v)}</button>`).join("");
  container.querySelectorAll(".chip").forEach((chip) => chip.addEventListener("click", () => {
    const v = chip.dataset.v; active.has(v) ? active.delete(v) : active.add(v); onChange();
  }));
}

function renderList() {
  const families = [...new Set(state.runs.map((r) => r.family))].filter((f) => state.showPrototypes || f !== "prototype").sort();
  const statuses = [...new Set(state.runs.map((r) => r.status))].sort();
  chips(document.getElementById("family-chips"), families, state.family, renderList);
  chips(document.getElementById("status-chips"), statuses, state.status, renderList);
  const shown = state.runs.filter((r) =>
    (state.showPrototypes || r.family !== "prototype") &&
    (!state.family.size || state.family.has(r.family)) &&
    (!state.status.size || state.status.has(r.status)) &&
    (!state.query || `${r.root}/${r.name}`.toLowerCase().includes(state.query)));
  const list = document.getElementById("list");
  if (!shown.length) { list.innerHTML = `<p class="tabs-empty" style="padding: 12px;">No runs match.</p>`; return; }
  list.innerHTML = shown.map((r) => `
    <button class="run" data-id="${escape(r.id)}" aria-current="${state.selected === r.id}">
      <div class="run-top"><span class="dot ${escape(r.status)}" title="${escape(r.status)}"></span><span class="run-name">${escape(r.name)}</span></div>
      <div class="run-meta"><span>${escape(r.root)}</span><span>${escape(r.family)}</span><span>${ago(r.updated)}</span>${r.media ? `<span>${r.media} media</span>` : ""}</div>
      ${r.headline.length ? `<div class="run-head">${r.headline.slice(0, 5).map((h) => `<span><b>${escape(h.label)}</b> ${escape(h.value)}</span>`).join("")}</div>` : ""}
    </button>`).join("");
  list.querySelectorAll(".run").forEach((el) => el.addEventListener("click", () => select(el.dataset.id)));
}

// Sparse series (scored every few epochs) connect across gaps; long noisy series are smoothed.
function prepare(line) {
  const pts = line.x.map((x, i) => [x, line.y[i]]).filter(([, y]) => y !== null && y !== undefined && Number.isFinite(y));
  if (pts.length <= 60) return { ...line, pts, smoothed: false };
  const window = Math.max(3, Math.round(pts.length / 30));
  const smooth = pts.map(([x], i) => {
    const slice = pts.slice(Math.max(0, i - window + 1), i + 1);
    return [x, slice.reduce((sum, [, y]) => sum + y, 0) / slice.length];
  });
  return { ...line, pts: smooth, smoothed: true };
}

function lineChart(title, rawLines) {
  const lines = rawLines.map(prepare).filter((l) => l.pts.length);
  const width = 320, height = 150, pad = { l: 42, r: 8, t: 6, b: 20 };
  const points = lines.flatMap((l) => l.pts);
  if (!points.length) return "";
  const xs = points.map((p) => p[0]), ys = points.map((p) => p[1]);
  let [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
  if (x0 === x1) x1 = x0 + 1;
  if (y0 === y1) { y0 = Math.min(y0, 0); y1 = y1 === 0 ? 1 : Math.max(y1, 0); }
  const sx = (x) => pad.l + ((x - x0) / (x1 - x0)) * (width - pad.l - pad.r);
  const sy = (y) => height - pad.b - ((y - y0) / (y1 - y0)) * (height - pad.t - pad.b);
  const fmt = (v) => Math.abs(v) >= 1000 ? `${(v / 1000).toFixed(v >= 1e5 ? 0 : 1)}k` : Math.abs(v) >= 10 ? v.toFixed(0) : Math.abs(v) >= 1 ? v.toFixed(1) : v.toPrecision(2);
  const paths = lines.map((l, k) => {
    const color = `var(${COLORS[k % COLORS.length]})`;
    const d = l.pts.map(([x, y], i) => `${i ? "L" : "M"}${sx(x).toFixed(1)},${sy(y).toFixed(1)}`).join("");
    const dots = l.pts.length <= 25 ? l.pts.map(([x, y]) => `<circle cx="${sx(x).toFixed(1)}" cy="${sy(y).toFixed(1)}" r="2" fill="${color}"/>`).join("") : "";
    return `<path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/>${dots}`;
  }).join("");
  const grid = [y0, (y0 + y1) / 2, y1].map((y) => `<line class="grid" x1="${pad.l}" x2="${width - pad.r}" y1="${sy(y)}" y2="${sy(y)}"/><text class="axis" x="${pad.l - 5}" y="${sy(y) + 3}" text-anchor="end">${fmt(y)}</text>`).join("");
  const axis = `<text class="axis" x="${pad.l}" y="${height - 5}">${fmt(x0)}</text><text class="axis" x="${width - pad.r}" y="${height - 5}" text-anchor="end">${fmt(x1)}</text>`;
  const legend = lines.map((l, k) => `<span><i style="background: var(${COLORS[k % COLORS.length]})"></i>${escape(l.metric)}${l.smoothed ? " (smoothed)" : ""}</span>`).join("");
  return `<div class="chart"><div class="chart-title" title="${escape(title)}">${escape(title)}</div><svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${escape(title)}">${grid}${axis}${paths}</svg><div class="legend">${legend}</div></div>`;
}

function renderCharts(series) {
  const groups = new Map();
  for (const s of series) {
    const scale = s.metric.includes("loss") || s.metric.includes("mse") ? "loss" : s.metric;
    const key = `${s.group} · ${scale === "loss" ? "loss" : s.metric}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(s);
  }
  return [...groups.entries()].map(([title, lines]) => lineChart(title, lines)).join("");
}

function mediaTile(root, item) {
  const url = `/media/${encodeURIComponent(root)}/${item.path.split("/").map(encodeURIComponent).join("/")}`;
  const body = item.path.endsWith(".mp4") ? `<video src="${url}" controls muted playsinline preload="metadata"></video>` : `<img src="${url}" alt="${escape(item.title)}" loading="lazy">`;
  return `<figure>${body}<figcaption><b>${escape(item.title)}</b><span>${escape(item.path)}</span></figcaption></figure>`;
}

async function select(id, keepScroll = false) {
  state.selected = id;
  if (location.hash !== `#${id}`) history.replaceState(null, "", `#${id}`);
  renderList();
  const [root, ...rest] = id.split("/");
  const detailEl = document.getElementById("detail");
  let run;
  try { run = await getJSON(`/api/runs/${encodeURIComponent(root)}/${encodeURIComponent(rest.join("/"))}`); }
  catch (error) { detailEl.innerHTML = `<p class="empty">${escape(error.message)}</p>`; return; }
  if (state.selected !== id) return;
  const scroll = window.scrollY;
  const cards = run.headline.map((h) => `<div class="card"><div class="k">${escape(h.label)}</div><div class="v">${escape(h.value)}</div></div>`).join("");
  const charts = renderCharts(run.curves);
  const table = run.table.length ? `<section><h3>Sweep</h3><div class="table"><table><thead><tr><th>Setting</th><th>Controller</th><th>Mean</th><th>Per seed</th></tr></thead><tbody>${run.table.map((row) => `<tr><td>${escape(row.setting)}</td><td>${escape(row.kind)}</td><td class="num">${row.mean.toFixed(1)}</td><td class="seeds">${row.scores.map((v) => v.toFixed(0)).join(", ")}</td></tr>`).join("")}</tbody></table></div></section>` : "";
  const media = run.media_files.map((p) => mediaTile(run.root, p)).join("");
  detailEl.innerHTML = `
    <div class="detail-head"><h2>${escape(run.name)}</h2><span class="pill ${escape(run.status)}">${escape(run.status)}</span></div>
    <div class="sub">${escape(run.root)} · ${escape(run.family)} · started ${stamp(run.started)} · updated ${ago(run.updated)}</div>
    ${cards ? `<div class="cards">${cards}</div>` : ""}
    ${table}
    ${charts ? `<section><h3>Curves</h3><div class="charts">${charts}</div></section>` : ""}
    ${media ? `<section><h3>Rollouts and figures</h3><div class="videos">${media}</div></section>` : ""}
    ${run.log.length ? `<section><h3>Log tail</h3><pre>${escape(run.log.join("\n"))}</pre></section>` : ""}
    <section><h3>Config and results</h3>
      <details><summary>config.json</summary><pre>${escape(JSON.stringify(run.config, null, 2))}</pre></details>
      <details><summary>results.json (per-episode lists omitted)</summary><pre>${escape(JSON.stringify(run.results, null, 2))}</pre></details>
    </section>`;
  if (keepScroll) window.scrollTo(0, scroll);
  const pre = detailEl.querySelector("section pre"); if (pre) pre.scrollTop = pre.scrollHeight;
}

const mediaUrl = (root, path) => `/media/${encodeURIComponent(root)}/${path.split("/").map(encodeURIComponent).join("/")}`;

function renderGallery() {
  document.getElementById("featured").innerHTML = state.featured.length
    ? state.featured.map((f) => `<figure class="feature"><video src="${mediaUrl(f.root, f.path)}" controls muted playsinline preload="metadata"></video><figcaption><b>${escape(f.title)}</b><span>${escape(f.note || "")}</span></figcaption></figure>`).join("")
    : `<p class="tabs-empty">No featured rollouts yet.</p>`;
  const present = AREA_ORDER.filter((area) => state.videos.some((v) => v.area === area && (state.showHidden || !v.hidden)));
  chips(document.getElementById("area-chips"), present, state.areas, renderGallery);
  const q = state.videoQuery;
  const shown = state.videos.filter((v) =>
    (state.showHidden || !v.hidden) &&
    (!state.areas.size || state.areas.has(v.area)) &&
    (!q || `${v.title} ${v.group} ${v.root}`.toLowerCase().includes(q)));
  const sections = present.filter((area) => shown.some((v) => v.area === area)).map((area) => {
    const items = shown.filter((v) => v.area === area);
    const tiles = items.map((v) => `<figure><video src="${mediaUrl(v.root, v.path)}" controls muted playsinline preload="metadata"></video><figcaption><b>${escape(v.title)}</b><span>${escape(v.group)}${v.root === "main" ? "" : ` · ${escape(v.root)}`} · ${ago(v.updated)}</span></figcaption></figure>`).join("");
    return `<details class="area" open><summary>${escape(area)} <span>${items.length}</span></summary><div class="videos">${tiles}</div></details>`;
  }).join("");
  document.getElementById("gallery").innerHTML = sections || `<p class="tabs-empty">No videos match.</p>`;
}

async function refresh() {
  try {
    const data = await getJSON("/api/runs");
    state.runs = data.runs;
    renderList();
    const linked = decodeURIComponent(location.hash.slice(1));
    const listed = state.runs.filter((r) => state.showPrototypes || r.family !== "prototype");
    if (!state.selected && linked && state.runs.some((r) => r.id === linked)) await select(linked);
    else if (!state.selected && listed.length) await select(listed[0].id);
    else if (state.selected && !document.getElementById("runs-view").hidden) {
      const open = document.querySelector("#detail video:not([paused])");
      const playing = [...document.querySelectorAll("#detail video")].some((v) => !v.paused);
      const reading = document.querySelector("#detail details[open]");
      if (!playing && !reading && !open) await select(state.selected, true);
    }
    document.getElementById("refresh").textContent = `${state.runs.length} runs · refreshed ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" })}`;
  } catch (error) {
    document.getElementById("refresh").textContent = `refresh failed: ${error.message}`;
  }
}

function liveCard(clip) {
  const curve = clip.curve || {};
  const metrics = [
    curve.mean_reward === undefined ? null : `reward ${Number(curve.mean_reward).toFixed(3)}`,
    curve.success_rate === undefined || curve.success_rate === null ? null : `training success ${(100 * curve.success_rate).toFixed(0)}%`,
    curve.lift_rate === undefined || curve.lift_rate === null ? null : `lift ${(100 * curve.lift_rate).toFixed(0)}%`,
    curve.env_steps === undefined ? null : `${(curve.env_steps / 1e6).toFixed(2)} M steps`,
    curve.encoder_loss === undefined || curve.encoder_loss === null ? null : "encoder trained",
  ].filter(Boolean).join(" · ");
  const outcomes = (clip.outcomes || []).join(", ");
  return `<figure class="card">
    <video src="/media/${encodeURIComponent(clip.root)}/${clip.path.split("/").map(encodeURIComponent).join("/")}?v=${Math.round(clip.updated)}" controls muted loop playsinline preload="metadata"></video>
    <figcaption>
      <strong>${escape(clip.run)}</strong>
      <p>iteration ${escape(clip.iteration)} · ${escape(clip.status)} · recorded ${ago(clip.updated)}</p>
      <p>${escape(outcomes)}</p>
      <p>${escape(metrics)}</p>
    </figcaption>
  </figure>`;
}

function renderLive() {
  const container = document.getElementById("live");
  container.innerHTML = state.live.map(liveCard).join("");
  document.getElementById("live-empty").hidden = state.live.length > 0;
}

async function loadLive() {
  const data = await getJSON("/api/live");
  state.live = data.clips;
  renderLive();
}

async function loadGallery() {
  const data = await getJSON("/api/gallery");
  state.videos = data.videos;
  state.featured = data.featured;
  renderGallery();
}

function show(view) {
  state.view = view;
  for (const name of ["runs", "rollouts", "live"]) {
    document.getElementById(`${name}-view`).hidden = name !== view;
    document.getElementById(`tab-${name}`).setAttribute("aria-pressed", name === view);
  }
  if (view === "rollouts") loadGallery();
  if (view === "live") loadLive();
}

document.getElementById("tab-runs").addEventListener("click", () => show("runs"));
document.getElementById("tab-rollouts").addEventListener("click", () => show("rollouts"));
document.getElementById("tab-live").addEventListener("click", () => show("live"));
document.getElementById("search").addEventListener("input", (e) => { state.query = e.target.value.toLowerCase(); renderList(); });
document.getElementById("video-search").addEventListener("input", (e) => { state.videoQuery = e.target.value.toLowerCase(); renderGallery(); });
document.getElementById("show-hidden").addEventListener("change", (e) => { state.showHidden = e.target.checked; renderGallery(); });
document.getElementById("show-prototypes").addEventListener("change", (e) => { state.showPrototypes = e.target.checked; renderList(); });
refresh();
setInterval(() => { refresh(); if (state.view === "live") loadLive(); }, 30000);
</script>
</body>
</html>
